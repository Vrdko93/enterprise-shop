global:
  imageTag: "1.0.0"

serviceDefaults:
  replicas: 1
  imagePullPolicy: IfNotPresent
  javaOptions: "-Xms64m -Xmx256m"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 448Mi

  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6

  tracing:
    enabled: true
    samplingProbability: "1.0"
    otlpEndpoint: "http://otel-collector:4318/v1/traces"

services:
  user-service:
    image: vrdko93/enterprise-shop-user-service
    port: 8081
    database: users
    redis: true
    jwt: true

  product-service:
    image: vrdko93/enterprise-shop-product-service
    port: 8082
    database: products
    redis: true
    jwt: false

  order-service:
    image: vrdko93/enterprise-shop-order-service
    port: 8083
    database: orders
    jwt: false
    redis: true

  payment-service:
    image: vrdko93/enterprise-shop-payment-service
    port: 8084
    database: payments
    jwt: false
    redis: false

  notification-service:
    image: vrdko93/enterprise-shop-notification-service
    port: 8085
    database: notifications
    jwt: false
    redis: false

  api-gateway:
    image: vrdko93/enterprise-shop-api-gateway
    port: 8080
    gateway: true
    redis: true

frontend:
  image: vrdko93/enterprise-shop-frontend
  replicas: 1
  port: 80
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

redis:
  image: redis
  tag: "7"
  replicas: 1
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

kafka:
  image: apache/kafka
  tag: "3.7.2"
  replicas: 1
  brokerPort: 29092
  controllerPort: 9093
  heapOpts: "-Xms128m -Xmx256m"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

postgres:
  image: postgres
  tag: "16"
  replicas: 1
  port: 5432
  database: shop
  dataDirectory: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    existingClaim: postgres-pvc
    size: 2Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  livenessProbeEnabled: false
  existingInitConfigMap: postgres-init
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

secrets:
  postgres:
    existingSecret: postgres-secret
  jwt:
    existingSecret: app-secret

otelCollector:
  image: otel/opentelemetry-collector-contrib
  tag: "0.115.1"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

tempo:
  image: grafana/tempo
  tag: "2.6.1"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  image: grafana/loki
  tag: "3.3.2"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

fluentBit:
  image: fluent/fluent-bit
  tag: "3.2.2"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

grafana:
  image: grafana/grafana
  tag: "11.4.0"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi