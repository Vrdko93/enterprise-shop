
name: enterprise-shop-infra

x-service-env: &service-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: shop
  POSTGRES_PASSWORD: shop
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP: kafka:29092

x-service-health: &service-health
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 120s

x-infra-dependencies: &infra-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 90s

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: enterprise-shop/user-service:1.0.0
    environment:
      <<: *service-env
      POSTGRES_DB: users
      JWT_SECRET: change-me-in-prod-this-is-a-demo-secret-key-32b+
    depends_on: *infra-dependencies
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      <<: *service-health

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    image: enterprise-shop/product-service:1.0.0
    environment:
      <<: *service-env
      POSTGRES_DB: products
    depends_on: *infra-dependencies
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"]
      <<: *service-health

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: enterprise-shop/order-service:1.0.0
    environment:
      <<: *service-env
      POSTGRES_DB: orders
    depends_on: *infra-dependencies
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8083'"]
      <<: *service-health

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: enterprise-shop/payment-service:1.0.0
    environment:
      <<: *service-env
      POSTGRES_DB: payments
    depends_on: *infra-dependencies
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8084'"]
      <<: *service-health

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: enterprise-shop/notification-service:1.0.0
    environment:
      <<: *service-env
      POSTGRES_DB: notifications
    depends_on: *infra-dependencies
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8085'"]
      <<: *service-health

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: enterprise-shop/api-gateway:1.0.0
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      ORDER_SERVICE_URI: http://order-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      <<: *service-health

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: enterprise-shop/frontend:1.0.0
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
